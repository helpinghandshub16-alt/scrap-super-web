<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scrap Super Admin</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#17703f">
<link rel="manifest" href="manifest-admin.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SS Admin">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Hind:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="admin">
<div class="banner" id="demoBanner" hidden>Demo mode — password: admin123</div>
<header class="top">
  <div class="wrap bar">
    <a class="logo" href="admin.html"><img src="icons/icon-192.png" alt="">Admin</a>
    <div class="tools">
      <a class="btn small ghost" href="index.html" style="color:inherit;border-color:rgba(255,255,255,.4)">Website</a>
      <button class="btn small sun" id="logoutBtn" type="button" hidden>Logout</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="loginBox" hidden>
    <div class="panel" style="max-width:420px;margin:20px auto">
      <form id="loginForm">
        <h2>Admin login</h2>
        <label for="l_email">Email<input id="l_email" type="email" autocomplete="username" required></label>
        <label for="l_pass">Password<input id="l_pass" type="password" autocomplete="current-password" required></label>
        <p class="err" id="loginErr" hidden></p>
        <button class="btn" type="submit">Login</button>
      </form>
    </div>
  </section>

  <section id="dash" hidden style="padding-top:0">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="orders" aria-selected="true" type="button">Orders<span class="cnt" id="cOrders" hidden></span></button>
      <button role="tab" data-tab="rates" aria-selected="false" type="button">Rates</button>
      <button role="tab" data-tab="news" aria-selected="false" type="button">News</button>
      <button role="tab" data-tab="apps" aria-selected="false" type="button">Job aavedan<span class="cnt" id="cApps" hidden></span></button>
      <button role="tab" data-tab="msgs" aria-selected="false" type="button">Messages<span class="cnt" id="cMsgs" hidden></span></button>
    </div>

    <!-- Orders -->
    <div data-pane="orders">
      <div class="stats">
        <div class="stat"><b id="sNew">0</b><span>Naye</span></div>
        <div class="stat"><b id="sToday">0</b><span>Aaj ke pickup</span></div>
        <div class="stat"><b id="sDue">0</b><span>Bhugtan baaki</span></div>
        <div class="stat"><b id="sPaid">₹0</b><span>Is mahine diya</span></div>
      </div>
      <div class="toolbar">
        <input id="q" type="search" placeholder="Naam / number / pata / booking no.">
        <select id="fStatus">
          <option value="">Sab status</option>
          <option>Naya</option><option>Confirmed</option><option>Picked</option><option>Paid</option><option>Cancel</option>
        </select>
        <select id="fDate">
          <option value="">Sab tareekh</option><option value="today">Aaj</option><option value="tomorrow">Kal</option><option value="upcoming">Aane wale</option>
        </select>
        <button class="btn small ghost" id="csvBtn" type="button">Excel (CSV)</button>
      </div>
      <div class="orders" id="orderList"></div>
    </div>

    <!-- Rates -->
    <div data-pane="rates" hidden>
      <p class="note" style="margin-top:0">Rate badal kar “Save” dabayein — website par turant badal jayega. Photo ke liye image ka link (URL) ya <code>images/naam.jpg</code> daalein.</p>
      <div class="orders" id="rateList"></div>
      <div class="toolbar"><button class="btn small" id="addRate" type="button">+ Naya scrap jodein</button></div>
    </div>

    <!-- News -->
    <div data-pane="news" hidden>
      <form class="panel" id="newsForm">
        <h3 class="mini">Nayi khabar jodein</h3>
        <label for="n_date">Tareekh<input id="n_date" type="date" required></label>
        <div class="row2">
          <label for="n_thi">Heading (Hindi)<input id="n_thi" required></label>
          <label for="n_ten">Heading (English)<input id="n_ten"></label>
        </div>
        <div class="row2">
          <label for="n_bhi">Khabar (Hindi)<textarea id="n_bhi" required></textarea></label>
          <label for="n_ben">Khabar (English)<textarea id="n_ben"></textarea></label>
        </div>
        <button class="btn" type="submit">Publish karein</button>
      </form>
      <div class="orders" id="newsList" style="margin-top:14px"></div>
    </div>

    <div data-pane="apps" hidden><div class="orders" id="appList"></div></div>
    <div data-pane="msgs" hidden><div class="orders" id="msgList"></div></div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="data.js"></script>
<script src="store.js"></script>
<script src="admin.js"></script>
</body>
</html>
